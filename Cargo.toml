[workspace]
members = [
    "crates/layers-core",
    "crates/layers-compiler",
    "crates/layers-store",
    "crates/layers-providers",
    "crates/layers-runtime",
    "crates/layers-tools",
    "crates/layers-channels",
    "crates/layers-mcp",
    "crates/layers-daemon",
]

[package]
name = "layers"
version = "0.1.0"
edition = "2024"
default-run = "layers"
rust-version = "1.85"

authors = ["Caelator + OpenClaw"]
description = "Council orchestrator and memory spine for multi-model AI workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/caelator/layers"
keywords = ["cli", "memory", "code-intelligence", "gitnexus", "local-first"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = "2"
lancedb = "0.27"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
layers-core = { path = "crates/layers-core" }
layers-compiler = { path = "crates/layers-compiler" }
layers-store = { path = "crates/layers-store" }
layers-mcp = { path = "crates/layers-mcp" }
layers-daemon = { path = "crates/layers-daemon", optional = true }
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
wait-timeout = "0.2"
substrate = { git = "https://github.com/caelator/substrate.git", optional = true }
dirs = "5"
sha2 = "0.10"
globset = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["deprecated-runtime", "substrate-storage"]
integration = []
# Compatibility surface for non-core daemon/runtime command paths. The default
# stays enabled for CLI compatibility; stable-core checks can compile without it
# via `cargo check --no-default-features --all-targets`.
deprecated-runtime = ["dep:layers-daemon"]
# Compatibility storage used by monitor/technician/prove-it artifacts. Stable
# context compiler builds must not require compatibility storage.
# The `proveit` binary declares this as a required feature and is skipped by
# no-default all-target checks.
substrate-storage = ["dep:substrate"]

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bin]]
name = "session-monitor"
path = "src/bin/session_monitor.rs"

[[bin]]
name = "proveit"
path = "src/proveit_main.rs"
required-features = ["substrate-storage"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
